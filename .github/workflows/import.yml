name: Import museot.fi

on:
  schedule:
    # 04:00 Europe/Helsinki. Helsinki is UTC+2 (EET) or UTC+3 (EEST); 01:00 UTC
    # covers EET and lands at 04:00 during EEST too.
    - cron: "0 1 * * *"
  workflow_dispatch: {}

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Run importer against remote D1
        run: pnpm import:museot
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
